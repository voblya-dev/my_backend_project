<!DOCTYPE html>
<html>
    <head>
        <title>Список фильмов</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    </head>
    <body>
        <table>
            <tr>
                <th>№ п/п</th>
                <th>Название</th>
                <th>Режиссёр</th>
                <th>Год выхода</th>
                <th>Постер</th>
            </tr>
            {% for film in films %}
            <tr>
                <td>{{ film[0] }}</td>
                <td>{{ film[1] }}</td>
                <td>{{ film[2] }}</td>
                <td>{{ film[3] }}</td>
                <td><img src="film/{{ film[0] }}/poster"></td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
